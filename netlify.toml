# Settings for hosting Dishio on Netlify (free, no credit card).
#
# - The web app is the "static" folder, served as it is (no build step).
# - The server part (/api/...) is netlify/functions/api.mjs.
# - The Gemini key is NOT in this file. Add it in the Netlify dashboard:
#   Project configuration > Environment variables > GEMINI_API_KEY.

[build]
  publish = "static"
  command = "echo Dishio needs no build step"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"

# The service worker must always be checked for updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
